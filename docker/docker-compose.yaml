services:
  ros_bridge:
    build:
      context: ../.
      dockerfile: docker/Dockerfile
      ssh: 
        - default
      args:
        ROS1_DISTRO: $ROS_BRIDGE_GRPC_ROS1_DISTRO
        ROS2_DISTRO: $ROS_BRIDGE_GRPC_ROS2_DISTRO
        SYSTEM_PACKAGES: $ROS_BRIDGE_GRPC_SYSTEM_PACKAGES
        USER_ROS1_REPOS: $ROS_BRIDGE_GRPC_USER_ROS1_REPOS
        USER_ROS2_REPOS: $ROS_BRIDGE_GRPC_USER_ROS2_REPOS
        ALLOWED_TYPES: $ROS_BRIDGE_GRPC_ALLOWED_TYPES
        MESSAGE_PACKAGES: $ROS_BRIDGE_GRPC_MESSAGE_PACKAGES
    image: ros_bridge_image
    container_name: ros_bridge_container
    tty: true
    stdin_open: true
    volumes:
      - ${ROS_BRIDGE_CONFIG:-/dev/null}:/ros_params.yaml
    network_mode: host
    pid: host
    ipc: host

  ros1_bridge:
    extends: ros_bridge
    image: ros1_bridge_image
    container_name: ros1_bridge_conainer
    build:
      target: ros1_base
    entrypoint: /entrypoints/run_ros1_bridge.bash

  ros2_bridge:
    extends: ros_bridge
    image: ros2_bridge_image
    container_name: ros2_bridge_conainer
    build:
      target: ros2_base
    entrypoint: /entrypoints/run_ros2_bridge.bash
    volumes:
      - ${CYCLONEDDS_URI:-/dev/null}:/cyclonedds_uri.xml
    environment:
      - ROS_DOMAIN_ID
      - RMW_IMPLEMENTATION
      - CYCLONEDDS_URI=/cyclonedds_uri.xml
